<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 소통 앱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .toast-enter { animation: fade-in-up 0.3s ease-out forwards; }
        .toast-leave { animation: fade-out-down 0.3s ease-in forwards; }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fade-out-down {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, 20px); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center overflow-x-hidden">

    <header class="w-full bg-indigo-600 text-white shadow-md z-10 sticky top-0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col items-center relative">
            <div class="text-[10px] text-indigo-200 font-medium tracking-wide mb-1">
                개발자:가치있는 미래교육 연구소 대표 김병찬
            </div>
            <h1 id="header-title" class="text-lg sm:text-xl font-bold text-center w-full truncate">
                <i class="fas fa-spinner fa-spin mr-2"></i>서버 연결 중...
            </h1>
            <button id="btn-show-speaker-login" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-indigo-100 hover:text-white transition p-2" title="강사용 모드">
                <i class="fas fa-user-shield"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col p-4 sm:p-6">
        
        <!-- 청중용 화면 (기본) -->
        <div id="audience-view" class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-7 flex flex-col gap-4 animate-fade-in">
            <div class="text-center mb-2">
                <h2 class="text-xl font-bold text-slate-800 mb-1">의견 보내기</h2>
                <p class="text-sm text-slate-500">질문이나 의견을 자유롭게 남겨주세요.</p>
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label for="input-name" class="text-sm font-semibold text-slate-700">이름 (소속)</label>
                <input type="text" id="input-name" placeholder="홍길동" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-slate-50 focus:bg-white text-base">
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label for="input-content" class="text-sm font-semibold text-slate-700">내용</label>
                <textarea id="input-content" rows="4" placeholder="여기에 내용을 입력해주세요..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition bg-slate-50 focus:bg-white text-base resize-none"></textarea>
            </div>
            
            <button id="btn-submit" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-sm flex items-center justify-center gap-2 active:scale-[0.98]">
                <i class="fas fa-paper-plane"></i>
                전송하기
            </button>
        </div>

        <!-- 강사용 화면 (숨김 처리됨) -->
        <div id="speaker-view" class="w-full hidden flex-col gap-4">
            <div class="flex justify-between items-center mb-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <button id="btn-back-audience" class="text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg hover:bg-indigo-50 transition text-sm sm:text-base">
                    <i class="fas fa-arrow-left mr-1"></i> 청중 모드
                </button>
                <div class="flex items-center gap-2 text-sm text-slate-500">
                    <i id="sync-icon" class="fas fa-sync-alt fa-spin mr-1 text-xs"></i> <span id="sync-text">실시간 동기화 중</span>
                </div>
                <a id="btn-go-sheet" href="#" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-4 py-2 rounded-lg transition text-sm sm:text-base flex items-center gap-2 shadow-sm">
                    <i class="fas fa-table"></i> 데이터서버
                </a>
            </div>
            
            <div id="data-list-container" class="flex flex-col gap-3">
                <div class="text-center py-10 text-slate-400">
                    <i class="fas fa-inbox text-4xl mb-3"></i>
                    <p>등록된 데이터가 없습니다.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- 관리자 인증 모달 -->
    <div id="pin-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="p-6">
                <h3 class="text-lg font-bold text-slate-800 mb-2">관리자 인증</h3>
                <p class="text-sm text-slate-500 mb-5">강사용 모드에 접근하려면 설정된 인증번호를 입력하세요.</p>
                <input type="password" id="input-pin" placeholder="인증번호" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-xl tracking-widest mb-5">
                <div class="flex gap-3">
                    <button id="btn-cancel-pin" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition">취소</button>
                    <button id="btn-confirm-pin" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 토스트 메시지 컨테이너 -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-max max-w-[90vw]"></div>

    <script>
        // =========================================================================
        // [중요] 구글 앱스 스크립트 웹 앱 배포 URL을 여기에 입력하세요!
        // =========================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyf1s4brz_dA8zs1Gt_s3oUVXqnBx2P8SrQBElpnmlCaAn4Qi2KxCvs6UXkjWHP4kyQ/exec'; // <-- 배포 후 생성된 URL로 반드시 교체하세요.

        let appConfig = { pin: '', title: '설정 불러오기 실패', sheetUrl: '#' };
        let currentMode = 'audience';
        let syncInterval = null;

        // DOM Elements
        const titleEl = document.getElementById('header-title');
        const viewAudience = document.getElementById('audience-view');
        const viewSpeaker = document.getElementById('speaker-view');
        const btnShowSpeaker = document.getElementById('btn-show-speaker-login');
        const btnSubmit = document.getElementById('btn-submit');
        const inputName = document.getElementById('input-name');
        const inputContent = document.getElementById('input-content');

        window.onload = () => {
            if (SCRIPT_URL.includes('AKfycb')) { // 임시 문자열 확인
                showToast('경고: 구글 스크립트 URL이 설정되지 않았습니다.', 'error');
                titleEl.innerHTML = '<i class="fas fa-exclamation-triangle text-amber-300 mr-2"></i>URL 설정 필요';
            } else {
                fetchAppConfig();
            }
            setupEventListeners();
        };

        // API 통신 함수 (GET/POST)
        async function fetchAPI(action, payload = null) {
            try {
                let url = `${SCRIPT_URL}?action=${action}`;
                let options = { method: 'GET' };

                if (payload) {
                    // CORS 우회를 위해 text/plain을 사용하여 POST 전송
                    options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: action, ...payload })
                    };
                }

                const response = await fetch(url, options);
                if (!response.ok) throw new Error('네트워크 응답이 올바르지 않습니다.');
                return await response.json();
            } catch (error) {
                console.error("API Fetch Error:", error);
                throw error;
            }
        }

        async function fetchAppConfig() {
            try {
                const config = await fetchAPI('getConfig');
                if (config.error) throw new Error(config.error);
                
                appConfig = config;
                titleEl.innerText = config.title;
                document.getElementById('btn-go-sheet').href = config.sheetUrl;
            } catch (error) {
                showToast('앱 설정을 불러오는데 실패했습니다.', 'error');
                titleEl.innerText = '서버 연결 실패';
            }
        }

        function setupEventListeners() {
            btnSubmit.addEventListener('click', submitData);
            btnShowSpeaker.addEventListener('click', showPinModal);
            document.getElementById('btn-back-audience').addEventListener('click', switchMode.bind(null, 'audience'));
            
            document.getElementById('btn-cancel-pin').addEventListener('click', hidePinModal);
            document.getElementById('btn-confirm-pin').addEventListener('click', verifyPin);
            document.getElementById('input-pin').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') verifyPin();
            });
        }

        async function submitData() {
            const name = inputName.value.trim();
            const content = inputContent.value.trim();

            if (!name) return showToast('이름을 입력해주세요.', 'warning');
            if (!content) return showToast('내용을 입력해주세요.', 'warning');

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 전송중...';

            try {
                const result = await fetchAPI('submit', { name: name, content: content });
                if (result.success) {
                    showToast('성공적으로 전송되었습니다!', 'success');
                    inputName.value = '';
                    inputContent.value = '';
                } else {
                    throw new Error('전송 실패');
                }
            } catch (error) {
                showToast('데이터 전송 중 오류가 발생했습니다.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-paper-plane"></i> 전송하기';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'speaker') {
                viewAudience.classList.add('hidden');
                viewSpeaker.classList.remove('hidden');
                viewSpeaker.classList.add('flex');
                btnShowSpeaker.classList.add('hidden');
                startSync();
            } else {
                viewSpeaker.classList.add('hidden');
                viewSpeaker.classList.remove('flex');
                viewAudience.classList.remove('hidden');
                btnShowSpeaker.classList.remove('hidden');
                stopSync();
            }
        }

        function startSync() {
            fetchData(); // 즉시 1회 실행
            syncInterval = setInterval(fetchData, 3000); // 3초마다 동기화
        }

        function stopSync() {
            if (syncInterval) clearInterval(syncInterval);
        }

        async function fetchData() {
            const syncIcon = document.getElementById('sync-icon');
            try {
                syncIcon.classList.add('fa-spin');
                const data = await fetchAPI('getData');
                renderDataList(data);
            } catch (error) {
                console.error('동기화 실패:', error);
            } finally {
                setTimeout(() => syncIcon.classList.remove('fa-spin'), 500); // 스핀 효과 유지를 위한 딜레이
            }
        }

        function renderDataList(dataArray) {
            const container = document.getElementById('data-list-container');
            if (!dataArray || dataArray.length === 0 || dataArray.error) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400 bg-white rounded-xl shadow-sm border border-slate-200">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>등록된 내용이 없습니다.</p>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            dataArray.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition relative group';
                
                const safeName = escapeHtml(item.name);
                const safeContent = escapeHtml(item.content).replace(/\n/g, '<br>');
                const rawContent = escapeQuotes(item.content);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="font-bold text-slate-800 flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full">#${item.id}</span>
                            ${safeName}
                        </div>
                        <button onclick="copyToClipboard('${rawContent}')" class="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg transition" title="내용 복사">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                    <div class="text-slate-700 text-base leading-relaxed break-words pr-2">
                        ${safeContent}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        const pinModal = document.getElementById('pin-modal');
        const inputPin = document.getElementById('input-pin');
        
        function showPinModal() {
            pinModal.classList.remove('hidden');
            pinModal.classList.add('flex');
            setTimeout(() => pinModal.children[0].classList.replace('scale-95', 'scale-100'), 10);
            inputPin.value = '';
            inputPin.focus();
        }

        function hidePinModal() {
            pinModal.children[0].classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                pinModal.classList.add('hidden');
                pinModal.classList.remove('flex');
            }, 200);
        }

        function verifyPin() {
            const entered = inputPin.value.trim();
            if (entered === appConfig.pin) {
                hidePinModal();
                showToast('강사 모드로 전환되었습니다.', 'success');
                switchMode('speaker');
            } else {
                showToast('인증번호가 일치하지 않습니다.', 'error');
                inputPin.value = '';
                inputPin.focus();
            }
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('내용이 복사되었습니다.', 'success'));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('내용이 복사되었습니다.', 'success');
                } catch (err) {
                    showToast('복사에 실패했습니다.', 'error');
                }
                textArea.remove();
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800';
            let icon = 'fa-info-circle';
            if (type === 'success') { bgClass = 'bg-emerald-600'; icon = 'fa-check-circle'; }
            if (type === 'error') { bgClass = 'bg-red-500'; icon = 'fa-exclamation-circle'; }
            if (type === 'warning') { bgClass = 'bg-amber-500'; icon = 'fa-exclamation-triangle'; }

            toast.className = `toast-enter flex items-center justify-center gap-3 px-4 py-3 rounded-xl text-white font-medium shadow-lg text-sm w-full sm:w-auto ${bgClass}`;
            toast.innerHTML = `<i class="fas ${icon} shrink-0"></i> <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function escapeHtml(unsafe) {
            if(!unsafe) return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeQuotes(unsafe) {
            if(!unsafe) return '';
            return unsafe.toString().replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }
    </script>
</body>
</html>
